name: Review

# The review loop: two models read the pull-request diff, one per axis the prompt declares, and upsert
# one comment with both axes side by side. It is deliberately non-blocking -- no model, no credentials
# and no comment may ever stop a merge. It needs the OLLAMA_API_KEY repository secret to reach a model;
# without it the job still comments, saying so and how to set the secret, and exits 0. There is no
# built-in-credential fallback. The optional REVIEW_MODEL_<AXIS> variables override one axis's model,
# where <AXIS> is that axis's name in .github/prompts/review.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # One review at a time repository-wide. The endpoint degrades when calls queue behind each other:
  # in the ticket-24 probe a fixed 9k-character prompt answered in 15s alone, 41s with two calls in
  # flight, and 57s with four -- where one deepseek-v4.1-flash call ran past 300s and was cut off by
  # the probe's own socket. The old per-ref group serialised one pull request and nothing else, so
  # pushes to two pull requests put up to four long requests against the one OLLAMA_API_KEY. This
  # group caps it at the two axes of a single review, which the probe measured at 6/6 answering.
  group: ${{ github.workflow }}
  # false, not true: a queued review must still run rather than replace another. A review is a
  # comment, not a gate, so waiting behind one costs nothing but the comment arrives.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    # Advice, not a gate: a failure here must not fail the workflow or hold up the pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect the diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git diff --unified=3 "origin/${BASE_REF}...HEAD" > pr.diff
          wc -c < pr.diff
      - name: Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          # Every repository variable at once, so this file never spells an axis name: the prompt's
          # headings are the only spelling and the optional REVIEW_MODEL_<AXIS> override is read there.
          REVIEW_VARIABLES: ${{ toJSON(vars) }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # What the comment stamps itself with: the revision it reviewed, and the run that did it.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/review.py --diff pr.diff --prompt .github/prompts/review.md
