name: Upstream probe (temporary)

# TEMPORARY diagnostic for ticket 24. Dispatch it by hand, read the numbers, then delete this file.
# It answers one question: does the review endpoint close connections because several requests are in
# flight against the one OLLAMA_API_KEY at once, or is it simply flaky when a single call is made?
# The key only exists in Actions, so the measurement can only happen here.

on:
  workflow_dispatch:

concurrency:
  group: upstream-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Probe the endpoint three ways
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: python3 - <<'PY'
import json
import os
import statistics
import threading
import time
import urllib.error
import urllib.request

base = (os.environ.get("LLM_BASE_URL") or "https://ollama.com/v1").rstrip("/")
url = f"{base}/chat/completions"
key = os.environ["OLLAMA_API_KEY"]
timeout = 300
models = ("deepseek-v4.1-flash", "glm-5.3-flash")

# One fixed prompt for every call: a representative slice of the review job's shape, big enough that
# the answer takes tens of seconds to generate, which is when the real loop dies.
diff = "\n".join(
    f"diff --git a/file{i}.py b/file{i}.py\n--- a/file{i}.py\n+++ b/file{i}.py\n"
    f"@@ -1,4 +1,6 @@\n+def helper_{i}(value):\n+    return value * {i}\n"
    for i in range(30)
)
prompt = (
    "You are a precise code reviewer. Write a detailed markdown review, at least 400 words and at "
    "least eight bullets, of the diff below. Use `file:line` where you can.\n\n"
    f"--- BEGIN DIFF ---\n{diff}\n--- END DIFF ---"
)
lock = threading.Lock()
rows = []


def classify(error):
    if isinstance(error, urllib.error.HTTPError):
        return "http_status"
    if isinstance(error, TimeoutError):
        return "read_timeout"
    if isinstance(error, urllib.error.URLError):
        if isinstance(error.reason, TimeoutError):
            return "read_timeout"
        return "connection_closed"
    return "other"


def call(model, scenario, rep, slot):
    payload = json.dumps(
        {
            "model": model,
            "messages": [
                {"role": "system", "content": "You are a precise code reviewer."},
                {"role": "user", "content": prompt},
            ],
            "temperature": 0.2,
        }
    ).encode("utf-8")
    request = urllib.request.Request(
        url,
        data=payload,
        method="POST",
        headers={
            "Content-Type": "application/json",
            "Accept": "application/json",
            "Authorization": f"Bearer {key}",
        },
    )
    start = time.monotonic()
    klass = "ok"
    detail = ""
    try:
        with urllib.request.urlopen(request, timeout=timeout) as response:
            body = response.read().decode("utf-8", errors="replace")
        answer = json.loads(body)
        content = answer["choices"][0]["message"]["content"]
        detail = f"{len(content)} chars"
    except Exception as error:  # noqa: BLE001 -- the class is the measurement.
        klass = classify(error)
        detail = f"{type(error).__name__}: {error}"[:160]
    seconds = time.monotonic() - start
    with lock:
        rows.append((model, scenario, rep, slot, klass, seconds, detail))
        print(
            f"RESULT model={model} scenario={scenario} rep={rep} slot={slot} "
            f"class={klass} secs={seconds:.1f} detail={detail}",
            flush=True,
        )


def scenario_concurrent(specs):
    threads = [threading.Thread(target=call, args=spec) for spec in specs]
    started = time.monotonic()
    for thread in threads:
        thread.start()
    for thread in threads:
        thread.join()
    print(f"WALL scenario={specs[0][1]} rep={specs[0][2]} secs={time.monotonic() - started:.1f}", flush=True)


def scenario_sequential(specs):
    started = time.monotonic()
    for spec in specs:
        call(*spec)
    print(f"WALL scenario={specs[0][1]} rep={specs[0][2]} secs={time.monotonic() - started:.1f}", flush=True)


for rep in range(1, 4):
    for model in models:
        call(model, "alone", rep, "a")
    scenario_concurrent([(model, "concurrent2", rep, f"s{i}") for i, model in enumerate(models)])
    scenario_sequential([(model, "sequential2", rep, f"s{i}") for i, model in enumerate(models)])
    scenario_concurrent(
        [(model, "concurrent4", rep, f"s{i}") for i, model in enumerate(models) for _ in range(2)]
    )

print("SUMMARY_BEGIN", flush=True)
for model in models:
    for scenario in ("alone", "concurrent2", "sequential2", "concurrent4"):
        group = [row for row in rows if row[0] == model and row[1] == scenario]
        if not group:
            continue
        seconds = sorted(row[5] for row in group)
        counts = {}
        for row in group:
            counts[row[4]] = counts.get(row[4], 0) + 1
        print(
            f"SUMMARY model={model} scenario={scenario} calls={len(group)} "
            f"classes={counts} p50_secs={statistics.median(seconds):.1f} max_secs={seconds[-1]:.1f}",
            flush=True,
        )
print("SUMMARY_END", flush=True)
PY
