name: Upstream probe (temporary)

# TEMPORARY diagnostic for ticket 24. It runs on a push that touches these two files, read the numbers
# in the log, then delete both. It answers one question: does the review endpoint close connections
# because several requests are in flight against the one OLLAMA_API_KEY at once, or is it simply flaky
# when a single call is made? The key only exists in Actions, so the measurement can only happen here.
#
# A push trigger and not workflow_dispatch: dispatch is registered from the default branch alone, so a
# workflow that exists only on a feature branch answers "Workflow does not have 'workflow_dispatch'
# trigger", and pushing master is out of bounds.

on:
  push:
    branches: [fix/review-loop-resilience]
    paths:
      - .github/workflows/upstream-probe.yml
      - .github/scripts/upstream_probe.py
  workflow_dispatch:

concurrency:
  group: upstream-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Probe the endpoint three ways
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: python3 .github/scripts/upstream_probe.py
