name: CI

# The blocking gates. Every job here must pass before a change can merge, and every check runs
# offline on a CPU runner: no model, no GPU, no live Common Crawl. The install step is not offline --
# `pip install -e '.[dev]'` reaches the package index from PyPI, so a network-isolated runner must
# still provide one for the install. Live-Common-Crawl tests are marked `network` and the real-model
# test `model`; both are deselected by the addopts in `pyproject.toml`.

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same ref supersedes the run in flight; the old one has nothing left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: ruff
        run: ruff check .

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: pytest
        run: pytest tests -q

  # The end-to-end path, named as its own gate because an acceptance gate was asked for. It is a
  # strict subset of the `unit` job -- same runner, same install, `pytest tests -q` already includes
  # these files -- so it adds no coverage. Its value is the fast, focused signal a named subset
  # gives, not extra tests.
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: end-to-end
        run: pytest tests/infrastructure/test_flow_end_to_end.py tests/interfaces -q
