name: CI

# The blocking gates. Every job here must pass before a change can merge, and every job runs
# offline on a CPU runner: no network, no model, no GPU. Live-Common-Crawl tests are marked
# `network` and deselected by pytest.ini's addopts.

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same ref supersedes the run in flight; the old one has nothing left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: ruff
        run: ruff check src tests main.py

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: pytest
        run: pytest tests -q

  # The end-to-end path, named as its own gate: the in-memory flow plus the CLI. Fakes satisfy
  # the ports, so it proves the wiring without a model or a network.
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: end-to-end
        run: pytest tests/infrastructure/test_flow_end_to_end.py tests/interfaces -q
