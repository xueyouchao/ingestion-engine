server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The page carries the whole manifest inline and weighs ~3.8 MiB; gzip is what makes it a reasonable
    # download over the internet. Images are already JPEG and are not re-compressed.
    gzip on;
    gzip_types application/json image/svg+xml;   # text/html is always gzipped
    gzip_min_length 1024;

    # The page is regenerated by `finepdfs bundle`; the images are content-addressed by Source Identity
    # and page, so they may be cached for good while the page itself is always revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /images/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
