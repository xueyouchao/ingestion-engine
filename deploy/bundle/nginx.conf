server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff;

    # The page carries the whole manifest inline and weighs ~3.8 MiB; gzip is what makes it a reasonable
    # download over the internet. Images are already JPEG and are not re-compressed.
    gzip on;
    gzip_types application/json image/svg+xml;   # text/html is always gzipped
    gzip_min_length 1024;

    # The page is regenerated by `finepdfs bundle` and always revalidated. An image's name carries the
    # hash of its own bytes, so a URL can be cached for good: a different render is a different URL.
    # An `add_header` inside a location replaces the server-level ones, so nosniff is repeated here.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    location /images/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
