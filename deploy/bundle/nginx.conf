server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff;

    # The page carries the whole manifest inline and weighs ~3.8 MiB; gzip is what makes it a reasonable
    # download over the internet. Images are already JPEG and are not re-compressed.
    gzip on;
    gzip_types application/json image/svg+xml;   # text/html is always gzipped
    gzip_min_length 1024;

    # The page is regenerated by `finepdfs bundle` and always revalidated. An image's name carries the
    # hash of its own bytes, so a URL can be cached for good: a different render is a different URL.
    # An `add_header` inside a location replaces the server-level ones, so nosniff is repeated here.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    location /images/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # The live demo, on the same origin as the page that links to it (deploy/demo/). The demo page's own
    # fetches are absolute -- /api/status, /api/read -- so both prefixes are forwarded, and the page under
    # /live/ needs its prefix stripped: the demo answers at its own root.
    #
    # ``host.docker.internal`` is the docker bridge on this host, where the demo's unit binds; run.sh
    # passes --add-host so the name resolves. X-Forwarded-For is what the demo's rate limit counts, so it
    # must be set here: without it every visitor would share the proxy's own address.
    location = /live {
        return 301 /live/;
    }
    location /live/ {
        proxy_pass http://host.docker.internal:8766/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A read is a job the page polls, so no response is long; this only bounds a stuck upgrade.
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://host.docker.internal:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # An upload body is streamed to the demo, which enforces its own byte cap and answers 413.
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
