[project]
name = "finepdfs-cocoindex"
version = "0.1.0"
description = "FinePDFs-style PDF curation on CocoIndex: real Common Crawl PDFs, pluggable OCR engines, incremental processing."
requires-python = ">=3.11"
# Pinned exactly, not floored: the spec's P0 asks for the working dependencies to be pinned, and a
# different CocoIndex or PyMuPDF can change page text, chunk ids and every citation built on them. The
# observed working versions are CocoIndex 1.0.25 and PyMuPDF 1.28.2. Bump both in one reviewed change
# with the demo evidence it was re-measured from.
dependencies = ["cocoindex==1.0.25", "pymupdf==1.28.2"]

[project.optional-dependencies]
# The dev extra installs the tools the CI lint gate runs, so `pip install -e '.[dev]'` is enough to
# reproduce every check locally.
dev = ["pytest>=8", "ruff>=0.6"]
# Docling is the CPU OCR Engine the demo runbook validates (README "Engines"). It is pinned and
# optional on purpose: the base install stays model-free and the offline suite needs no weights. Docling
# pulls torch as its own dependency; the observed working CPU environment -- docling 2.140.0, torch
# 2.10.0+cpu, easyocr 1.7.2 -- is recorded in docs/demo/requirements-demo.txt with the CPU wheel index
# it was installed from. No unpinned torch is listed here, so the base install cannot silently pull a
# GPU build.
docling = ["docling==2.140.0"]
# The original fasttext-wheel 0.9.2 raises on `predict` under NumPy 2 ("Unable to avoid copy while
# creating an array as requested"); this is the same library built against the NumPy 2 headers, and it is
# what the upstream FinePDFs pipeline depends on too. Only the FINEPDFS_LANGUAGE=fasttext mode needs it.
language = ["fasttext-numpy2-wheel>=0.9.2"]

[project.scripts]
finepdfs = "finepdfs.interfaces.cli:main"
finepdfs-demo = "finepdfs.interfaces.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finepdfs"]

[tool.ruff]
line-length = 120
target-version = "py311"
# bench/ is the superseded throwaway prototype (ADR-0002); excluded so `ruff check .` covers the shipped pipeline.
exclude = ["bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PYI"]

[tool.ruff.lint.per-file-ignores]
# Tests hold long JSON literals on purpose, and real non-latin text is the point of the language tests.
"tests/**" = ["E501", "RUF001"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not network and not model'"
markers = [
    "network: reaches the live Common Crawl index or data host",
    "model: needs a model file that is downloaded, not shipped",
]
