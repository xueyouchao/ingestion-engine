[project]
name = "finepdfs-cocoindex"
version = "0.1.0"
description = "FinePDFs-style PDF curation on CocoIndex: real Common Crawl PDFs, pluggable OCR engines, incremental processing."
requires-python = ">=3.11"
dependencies = ["cocoindex>=1.0.25", "pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finepdfs = "finepdfs.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finepdfs"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PYI"]

[tool.ruff.lint.per-file-ignores]
# Tests hold long JSON literals on purpose, and real non-latin text is the point of the language tests.
"tests/**" = ["E501", "RUF001"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: reaches the live Common Crawl index or data host"]
